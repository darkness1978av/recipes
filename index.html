<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="המתכונים שלנו">
<meta name="theme-color" content="#f6f1ea">
<title>המתכונים שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1ea; --surface:#fffdf9; --surface-2:#efe7dc; --text:#2b2420; --muted:#7a6e64; --border:#e3d8ca;
  --accent:#c4532d; --accent-ink:#ffffff; --accent-soft:#f6dfd4; --danger:#b3261e;
  --radius:16px; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1715; --surface:#25201d; --surface-2:#302a26; --text:#f3ece5; --muted:#a89a8e; --border:#3b342f;
         --accent:#e0714a; --accent-soft:#4a2c21; --danger:#ff8a80; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Rubik,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:16px;padding-top:calc(14px + env(safe-area-inset-top))}
h1{font-size:26px;margin:4px 0 14px;font-weight:700}
h2{font-size:18px;margin:22px 0 10px;font-weight:600}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabbar button{flex:1;background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;cursor:pointer}
.tabbar .ic{font-size:22px;line-height:1.2}
.tabbar button.on{color:var(--accent);font-weight:600}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--surface-2);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.input{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
textarea.input{resize:vertical;min-height:46px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.static{cursor:default}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.rcard{overflow:hidden;cursor:pointer;text-align:right;padding:0;display:flex;flex-direction:column}
.rcard .img{aspect-ratio:4/3;background:var(--surface-2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:44px}
.rcard .body{padding:10px 12px 12px}
.rcard .t{font-weight:600;font-size:15px;line-height:1.3}
.rcard .m{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}
.filters{margin:10px 0 16px;display:flex;flex-direction:column;gap:10px}
.label{font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:500}
.row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.grow{flex:1;min-width:0}
.x{background:none;border:0;color:var(--muted);font-size:20px;padding:10px 6px;cursor:pointer;line-height:1}
.mic{width:104px;height:104px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:42px;display:block;margin:12px auto 6px;box-shadow:0 6px 20px rgba(196,83,45,.35);cursor:pointer}
.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(196,83,45,.55)}70%{box-shadow:0 0 0 20px rgba(196,83,45,0)}100%{box-shadow:0 0 0 0 rgba(196,83,45,0)}}
.miclabel{text-align:center;font-size:14px;color:var(--muted)}
.interim{text-align:center;min-height:26px;margin:8px 0;font-style:italic}
.hint{color:var(--muted);font-size:14px;line-height:1.55}
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--radius);display:block;margin-bottom:14px}
.ing{list-style:none;padding:0;margin:0}
.ing li{padding:11px 4px;border-bottom:1px solid var(--border);display:flex;gap:10px;cursor:pointer;line-height:1.4}
.ing li.done{opacity:.4;text-decoration:line-through}
.ing .amt{color:var(--accent);font-weight:600;min-width:70px}
.steps{padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;line-height:1.6}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.notes{background:var(--surface-2);border-radius:12px;padding:12px 14px;line-height:1.6;white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.back{background:none;border:0;color:var(--accent);font-size:16px;padding:6px 0;cursor:pointer}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw;text-align:center;line-height:1.4}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;color:#fff;font-size:17px;flex-direction:column;gap:14px}
.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:40px 16px;line-height:1.6}
.files{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.fileitem{position:relative}
.thumb{width:86px;height:86px;border-radius:10px;object-fit:cover;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--surface-2);font-size:12px;text-align:center;padding:4px;overflow:hidden}
.fileitem .x{position:absolute;top:-8px;left:-8px;background:var(--surface);border:1px solid var(--border);border-radius:50%;width:28px;height:28px;padding:0;font-size:16px}
.filebox{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border:2px dashed var(--border);border-radius:var(--radius);padding:28px 16px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface)}
.filebox .big{font-size:36px}
.imgedit{display:flex;gap:12px;align-items:center}
.imgedit img{width:96px;height:96px;object-fit:cover;border-radius:12px}
.boot{padding:60px 20px;text-align:center;color:#888;font-family:system-ui}
.sticky{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));padding-top:10px;background:linear-gradient(transparent,var(--bg) 30%)}
.member{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.member:last-child{border-bottom:0}
.authwrap{max-width:440px;margin:0 auto;padding:40px 20px;padding-top:calc(40px + env(safe-area-inset-top))}
.logo{font-size:60px;text-align:center;margin-bottom:6px}
.center{text-align:center}
.ltr{direction:ltr;text-align:left}
.codeinput{font-size:28px;letter-spacing:6px;text-align:center;direction:ltr}
.section{padding:16px;margin-top:12px}
.or{text-align:center;color:var(--muted);margin:18px 0}
.err{color:var(--danger);font-size:14px;margin-top:10px;line-height:1.5}
.invite{font-size:28px;font-weight:700;letter-spacing:5px;direction:ltr;text-align:center;margin:6px 0 12px;color:var(--accent)}
.link{background:none;border:0;color:var(--accent);padding:8px 0;cursor:pointer;font-size:15px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="root"><div class="boot">טוען…</div></div>

<script type="module">
import React, { useState, useEffect, useRef, useMemo, useCallback } from 'https://esm.sh/react@18.3.1';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1';
import htm from 'https://esm.sh/htm@3.1.1';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const html = htm.bind(React.createElement);

// ===== הגדרות =====
const SUPABASE_URL = 'https://taihfgfrslmkjlzprczz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JaZOC6UxzaIGgjUu1Lt1zQ_zjGFNFyz';
const BUCKET = 'recipe-images';
const DISH_TYPES = ['בשרי', 'דג', 'צמחוני', 'מאפה', 'אחר'];
const DISH_EMOJI = { 'בשרי': '🍖', 'דג': '🐟', 'צמחוני': '🥗', 'מאפה': '🥐', 'אחר': '🍽️' };
const GROUP_TAGS = ['הורים', 'ילדים'];
const APP_URL = location.origin + location.pathname;

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

// ===== עזרים =====
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// קישור הזמנה: ...#join=CODE
(() => {
  const m = location.hash.match(/join=([A-Za-z0-9]+)/);
  if (m) {
    store.set('pending-join', m[1].toUpperCase());
    try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  }
})();

const one = d => Array.isArray(d) ? d[0] : d;

function normalize(r = {}) {
  return {
    id: r.id,
    title: r.title || '',
    dish_type: DISH_TYPES.includes(r.dish_type) ? r.dish_type : 'אחר',
    servings: r.servings || '',
    ingredients: (r.ingredients || []).map(i => typeof i === 'string' ? { item: i, amount: '' } : { item: i.item || '', amount: i.amount || '' }),
    steps: (r.steps || []).map(s => typeof s === 'string' ? s : (s.text || '')),
    notes: r.notes || '',
    liked_by: r.liked_by || [],
    image_url: r.image_url || null,
    raw_input: r.raw_input || null,
    created_at: r.created_at,
  };
}

function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('לא הצלחתי לקרוא את התמונה')); };
    img.src = url;
  });
}

async function compressImage(file, max = 1600, q = 0.82) {
  const img = await loadImage(file);
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s);
  c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('כיווץ התמונה נכשל')), 'image/jpeg', q));
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}

async function callServer(body) {
  const { data: s } = await sb.auth.getSession();
  const token = s.session?.access_token;
  let r;
  try {
    r = await fetch(`${SUPABASE_URL}/functions/v1/edit-recipe`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_KEY,
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      },
      body: JSON.stringify(body),
    });
  } catch { throw new Error('אין חיבור לשרת. בדוק את האינטרנט ונסה שוב.'); }
  let data = {};
  try { data = await r.json(); } catch {}
  if (r.status === 401) throw new Error(data.error || 'השרת דחה את הבקשה. נסה להתנתק ולהתחבר מחדש.');
  if (!r.ok || data.error) throw new Error(data.error || data.message || data.msg || `שגיאה ${r.status}`);
  return data;
}

async function aiEdit({ text, files }) {
  try {
    const data = await callServer({ text, files });
    return normalize(data.recipe);
  } catch (e) { throw new Error('העריכה נכשלה: ' + e.message); }
}

const pathFromUrl = u => {
  const p = u && u.split(`/${BUCKET}/`)[1];
  return p ? decodeURIComponent(p.split('?')[0]) : null;
};

async function removeImage(url) {
  const p = pathFromUrl(url);
  if (p) await sb.storage.from(BUCKET).remove([p]);
}

async function uploadImage(kitchenId, recipeId, file) {
  const blob = await compressImage(file, 1400, 0.8);
  const path = `${kitchenId}/${recipeId}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: true });
  if (error) throw new Error('העלאת התמונה נכשלה: ' + error.message);
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

async function saveRecipe(rec, imageFile, oldImageUrl, kitchenId) {
  const row = {
    title: rec.title.trim() || 'מתכון ללא שם',
    dish_type: rec.dish_type,
    liked_by: rec.liked_by,
    ingredients: rec.ingredients.filter(i => i.item.trim()),
    steps: rec.steps.filter(s => s.trim()),
    notes: rec.notes.trim() || null,
    servings: rec.servings.trim() || null,
    image_url: rec.image_url || null,
  };
  if (!rec.id) { row.raw_input = rec.raw_input || null; row.kitchen_id = kitchenId; }
  const write = r => rec.id
    ? sb.from('recipes').update(r).eq('id', rec.id).select().single()
    : sb.from('recipes').insert(r).select().single();
  let { data, error } = await write(row);
  if (error && /servings/.test(error.message || '')) { delete row.servings; ({ data, error } = await write(row)); }
  if (error) throw new Error('השמירה נכשלה: ' + error.message);
  if (imageFile) {
    const url = await uploadImage(kitchenId, data.id, imageFile);
    const res = await sb.from('recipes').update({ image_url: url }).eq('id', data.id).select().single();
    if (res.error) throw new Error('שמירת התמונה נכשלה: ' + res.error.message);
    data = res.data;
  }
  if (oldImageUrl && oldImageUrl !== data.image_url) { try { await removeImage(oldImageUrl); } catch {} }
  return normalize(data);
}

function recipeText(r) {
  const out = [`🍽️ ${r.title}`];
  if (r.servings) out.push(`כמות: ${r.servings}`);
  if (r.ingredients.length) { out.push('', 'מצרכים:'); r.ingredients.forEach(i => out.push(`• ${i.amount ? i.amount + ' ' : ''}${i.item}`)); }
  if (r.steps.length) { out.push('', 'אופן ההכנה:'); r.steps.forEach((s, n) => out.push(`${n + 1}. ${s}`)); }
  if (r.notes) out.push('', `הערות: ${r.notes}`);
  return out.join('\n');
}

async function shareText(text, toast, copiedMsg) {
  try {
    if (navigator.share) await navigator.share({ text });
    else { await navigator.clipboard.writeText(text); toast(copiedMsg); }
  } catch (e) { if (e.name !== 'AbortError') toast('השיתוף נכשל'); }
}

function useWakeLock(on) {
  useEffect(() => {
    if (!on || !('wakeLock' in navigator)) return;
    let lock = null, dead = false;
    const req = async () => { try { lock = await navigator.wakeLock.request('screen'); } catch {} };
    const onVis = () => { if (document.visibilityState === 'visible' && !dead) req(); };
    req();
    document.addEventListener('visibilitychange', onVis);
    return () => { dead = true; document.removeEventListener('visibilitychange', onVis); try { lock && lock.release(); } catch {} };
  }, [on]);
}

const authError = e => {
  const m = e?.message || '';
  if (/invalid login credentials/i.test(m)) return 'מייל או סיסמה שגויים.';
  if (/already registered|already exists/i.test(m)) return 'המייל הזה כבר רשום. נסה להתחבר במקום להירשם.';
  if (/password/i.test(m) && /(6|short|least|weak)/i.test(m)) return 'הסיסמה צריכה להכיל לפחות 6 תווים.';
  if (/not confirmed/i.test(m)) return 'החשבון ממתין לאישור מייל. במסך Sign In / Providers ב-Supabase צריך לכבות את Confirm email.';
  if (e?.status === 429 || /rate limit|too many/i.test(m)) return 'יותר מדי ניסיונות. חכה כמה דקות ונסה שוב.';
  if (/email/i.test(m) && /valid/i.test(m)) return 'כתובת המייל לא תקינה.';
  return m || 'משהו השתבש, נסה שוב.';
};

// ===== מסכי כניסה =====
function LoginView() {
  const [mode, setMode] = useState('login'); // login | signup | forgot
  const [email, setEmail] = useState(() => store.get('last-email', ''));
  const [password, setPassword] = useState('');
  const [password2, setPassword2] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const pending = store.get('pending-join', null);

  const go = m => { setMode(m); setErr(''); setPassword(''); setPassword2(''); };

  const submit = async () => {
    const e = email.trim().toLowerCase();
    if (!e || !password) return;
    if (mode === 'signup') {
      if (password.length < 6) { setErr('הסיסמה צריכה להכיל לפחות 6 תווים.'); return; }
      if (password !== password2) { setErr('הסיסמאות לא זהות.'); return; }
    }
    setBusy(true); setErr('');
    store.set('last-email', e);
    if (mode === 'signup') {
      const { data, error } = await sb.auth.signUp({ email: e, password });
      setBusy(false);
      if (error) { setErr(authError(error)); return; }
      if (!data.session) setErr('ההרשמה נקלטה, אבל החשבון ממתין לאישור מייל. במסך Sign In / Providers ב-Supabase צריך לכבות את Confirm email.');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: e, password });
      setBusy(false);
      if (error) setErr(authError(error));
    }
  };

  const onEnter = e => { if (e.key === 'Enter') submit(); };

  if (mode === 'forgot') return html`<div className="authwrap">
    <div className="logo">🔑</div>
    <h1 className="center">שכחתי סיסמה</h1>
    <div className="card section">
      <p className="hint" style=${{ marginTop: 0 }}>
        מי שיצר את ספר המתכונים יכול לתת לך סיסמה חדשה: בלשונית <b>משפחה</b>, ברשימת <b>החברים בספר</b>, ליד השם שלך יש כפתור <b>איפוס סיסמה</b>.
      </p>
      <p className="hint">אחרי שתיכנס עם הסיסמה החדשה, אפשר להחליף אותה לסיסמה שלך בלשונית משפחה, תחת "חשבון".</p>
      <p className="hint">אם אתה זה שיצר את הספר ושכחת את הסיסמה, אפשר לאפס אותה דרך לוח הבקרה של Supabase.</p>
      <button className="btn block" onClick=${() => go('login')}>חזרה לכניסה</button>
    </div>
  </div>`;

  const signup = mode === 'signup';
  return html`<div className="authwrap">
    <div className="logo">🍳</div>
    <h1 className="center">המתכונים שלנו</h1>
    ${pending && html`<p className="hint center">הוזמנת להצטרף לספר מתכונים. ${signup ? 'הירשם' : 'התחבר או הירשם'} וההצטרפות תתבצע אוטומטית.</p>`}

    <div className="card section">
      <h2 style=${{ marginTop: 0 }}>${signup ? 'הרשמה' : 'כניסה'}</h2>
      <div className="label" style=${{ marginTop: 0 }}>מייל</div>
      <input className="input ltr" type="email" inputMode="email" autoComplete="email" value=${email}
        placeholder="name@gmail.com" onInput=${e => setEmail(e.target.value)} onKeyDown=${onEnter} />

  const shown = useMemo(() => recipes.filter(r => {

function RecipeView({ recipe, loading, onBack, onEdit, onDelete, toast }) {
  const [done, setDone] = useState([]);
  const fileRef = useRef(null);

  useEffect(() => {
    fileRef.current = null;
    if (!recipe?.image_url) return;
    let alive = true;
    fetch(recipe.image_url).then(r => r.blob()).then(b => {
      if (alive) fileRef.current = new File([b], 'recipe.jpg', { type: b.type || 'image/jpeg' });
    }).catch(() => {});
    return () => { alive = false; };
  }, [recipe?.image_url]);

  if (!recipe) return html`<div className="wrap">
    <button className="back" onClick=${onBack}>→ חזרה</button>
    <div className="empty">${loading ? 'טוען…' : 'המתכון לא נמצא.'}</div>
  </div>`;

  // שיתוף טקסט (ותמונה) בלבד - בלי קישור לאפליקציה
  const share = async () => {
    const text = recipeText(recipe);
    try {
      const f = fileRef.current;
      if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
        await navigator.share({ files: [f], title: recipe.title, text });
      } else if (navigator.share) {
        await navigator.share({ title: recipe.title, text });
      } else {
        await navigator.clipboard.writeText(text);
        toast('המתכון הועתק');
      }
    } catch (e) { if (e.name !== 'AbortError') toast('השיתוף נכשל'); }
  };

  const toggleDone = i => setDone(d => d.includes(i) ? d.filter(x => x !== i) : [...d, i]);

  return html`<div className="wrap">
    <div className="top">
      <button className="back" onClick=${onBack}>→ כל המתכונים</button>
      <button className="btn sm primary" onClick=${share}>שתף ↗</button>
    </div>
    ${recipe.image_url && html`<img className="hero" src=${recipe.image_url} alt="" />`}
    <h1>${recipe.title}</h1>
    <div className="chips">
      <span className="chip static">${DISH_EMOJI[recipe.dish_type]} ${recipe.dish_type}</span>
      ${recipe.servings && html`<span className="chip static">${recipe.servings}</span>`}
      ${recipe.liked_by.map(p => html`<span key=${p} className="chip static">❤️ ${p}</span>`)}
    </div>

    ${recipe.ingredients.length > 0 && html`<h2>מצרכים</h2>
      <ul className="ing">
        ${recipe.ingredients.map((i, n) => html`<li key=${n} className=${done.includes(n) ? 'done' : ''} onClick=${() => toggleDone(n)}>
          <span className="amt">${i.amount}</span><span>${i.item}</span>
        </li>`)}
      </ul>
      <div className="hint" style=${{ marginTop: 6 }}>טיפ: לחיצה על מצרך מסמנת אותו.</div>`}

    ${recipe.steps.length > 0 && html`<h2>אופן ההכנה</h2>
      <ol className="steps">${recipe.steps.map((s, n) => html`<li key=${n}><span>${s}</span></li>`)}</ol>`}

    ${recipe.notes && html`<h2>הערות</h2><div className="notes">${recipe.notes}</div>`}

    <div className="actions">
      <button className="btn" onClick=${onEdit}>✏️ עריכה</button>
      <button className="btn danger" onClick=${onDelete}>🗑️ מחיקה</button>
    </div>
  </div>`;
}

function VoiceView({ onProcessed, setBusy, toast, draftKey }) {
  const [lines, setLines] = useState(() => store.get(draftKey, []));
  const [typed, setTyped] = useState('');
  const [interim, setInterim] = useState('');
  const [live, setLive] = useState(false);
  const [err, setErr] = useState('');
  const recRef = useRef(null);
  useWakeLock(true);

  useEffect(() => { store.set(draftKey, lines); }, [lines, draftKey]);
  useEffect(() => () => { try { recRef.current?.abort(); } catch {} }, []);

  const add = t => { t = (t || '').trim(); if (t) setLines(ls => [...ls, t]); };

  const toggleMic = () => {
    if (live) { try { recRef.current?.stop(); } catch {} return; }
    if (!SR) { setErr('הדפדפן לא תומך בזיהוי דיבור. אפשר להשתמש בשדה הטקסט ובמיקרופון של המקלדת.'); return; }
    setErr('');
    const rec = new SR();
    rec.lang = 'he-IL';
    rec.interimResults = true;
    rec.continuous = false;
    let latest = '';
    rec.onresult = e => {
      latest = Array.from(e.results).map(r => r[0].transcript).join(' ');
      setInterim(latest);
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') setErr('צריך לאשר גישה למיקרופון (בהגדרות האייפון → Safari → מיקרופון).');
      else if (e.error !== 'no-speech' && e.error !== 'aborted') setErr('זיהוי הדיבור נעצר. אפשר לנסות שוב או להקליד.');
    };
    rec.onend = () => { setLive(false); setInterim(''); add(latest); recRef.current = null; };
    recRef.current = rec;
    try { rec.start(); setLive(true); } catch { setErr('לא הצלחתי להפעיל את המיקרופון.'); }
  };

  const addTyped = () => { add(typed); setTyped(''); };
  const setLine = (n, v) => setLines(ls => ls.map((l, j) => j === n ? v : l));

  const finish = async () => {
    const text = lines.filter(l => l.trim()).join('\n');
    setBusy('עורך את המתכון…');
    try {
      const r = await aiEdit({ text });
      r.raw_input = text;
      onProcessed(r, 'voice');
    } catch (e) { toast(e.message); }
    finally { setBusy(null); }
  };

  const clear = () => { if (confirm('למחוק את כל הטיוטה?')) setLines([]); };

  return html`<div className="wrap">
    <h1>מתכון חדש בהקלטה</h1>
    <p className="hint">לחץ על המיקרופון ואמור מצרך או שלב. כל משפט נשמר כשורה שאפשר לערוך. בסיום, לחץ "סיים וערוך מתכון". המסך יישאר דלוק בזמן ההקלטה.</p>

    <button className=${'mic' + (live ? ' live' : '')} onClick=${toggleMic} aria-label="הקלטה">${live ? '■' : '🎤'}</button>
    <div className="miclabel">${live ? 'מקשיב… לחץ לעצירה' : 'לחץ ודבר'}</div>
    <div className="interim">${interim}</div>
    ${err && html`<div className="hint" style=${{ color: 'var(--danger)', textAlign: 'center' }}>${err}</div>`}

    <div className="row" style=${{ marginTop: 12 }}>
      <textarea className="input grow" rows="1" value=${typed} placeholder="או הקלד / הכתב עם המקלדת…"
        onInput=${e => setTyped(e.target.value)}
        onKeyDown=${e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addTyped(); } }}></textarea>
      <button className="btn" onClick=${addTyped} disabled=${!typed.trim()}>הוסף</button>
    </div>

    ${lines.length > 0 && html`<h2>מה נאמר עד עכשיו (${lines.length})</h2>`}
    ${lines.map((l, n) => html`<div className="row" key=${n}>
      <textarea className="input grow" rows="2" value=${l} onInput=${e => setLine(n, e.target.value)}></textarea>
      <button className="x" aria-label="מחק" onClick=${() => setLines(ls => ls.filter((_, j) => j !== n))}>✕</button>
    </div>`)}

    ${lines.length > 0 && html`<div className="sticky">
      <button className="btn primary block" onClick=${finish}>✨ סיים וערוך מתכון</button>
      <button className="btn block" style=${{ marginTop: 8, background: 'transparent' }} onClick=${clear}>נקה טיוטה</button>
    </div>`}
  </div>`;
}

function UploadView({ onProcessed, setBusy, toast }) {
  const [files, setFiles] = useState([]);
  const [note, setNote] = useState('');
  const input = useRef(null);

  const pick = e => {
    const fs = Array.from(e.target.files || []);
    e.target.value = '';
    setFiles(prev => [...prev, ...fs.map(f => ({ file: f, preview: f.type.startsWith('image/') ? URL.createObjectURL(f) : null }))]);
  };

  const go = async () => {
    setBusy('קורא את המתכון…');
    try {
      const payload = [];
      let extra = '';
      for (const { file } of files) {
        if (file.type.startsWith('image/')) {
          const b = await compressImage(file, 2000, 0.85);
          payload.push({ mimeType: 'image/jpeg', data: await blobToBase64(b) });
        } else if (file.type === 'application/pdf') {
          if (file.size > 15e6) throw new Error(`הקובץ ${file.name} גדול מדי (עד 15MB).`);
          payload.push({ mimeType: 'application/pdf', data: await blobToBase64(file) });
        } else if (file.type.startsWith('text/')) {
          extra += '\n' + await file.text();
        } else {
          throw new Error(`הקובץ ${file.name} לא נתמך. אפשר להעלות תמונה, PDF או קובץ טקסט.`);
        }
      }
      const text = (note + extra).trim() || undefined;
      const r = await aiEdit({ text, files: payload });
      if (text) r.raw_input = text;
      onProcessed(r, 'upload');
    } catch (e) { toast(e.message); }
    finally { setBusy(null); }
  };

  return html`<div className="wrap">
    <h1>מתכון מצילום או מסמך</h1>
    <p className="hint">העלה צילום מסך, צילום של דף מתכון או קובץ PDF. אם המתכון מתפרש על כמה עמודים, אפשר להעלות כמה קבצים יחד.</p>

    <input ref=${input} type="file" accept="image/*,application/pdf,text/plain" multiple hidden onChange=${pick} />
    <div className="filebox" onClick=${() => input.current.click()}>
      <div className="big">📄</div>
      <div>לחץ לבחירת תמונה או קובץ</div>
    </div>

    ${files.length > 0 && html`<div className="files">
      ${files.map((f, n) => html`<div className="fileitem" key=${n}>
        ${f.preview ? html`<img className="thumb" src=${f.preview} alt="" />` : html`<div className="thumb">${f.file.name}</div>`}
        <button className="x" aria-label="הסר" onClick=${() => setFiles(fs => fs.filter((_, j) => j !== n))}>✕</button>
      </div>`)}
    </div>`}

    <div className="label">הערות נוספות (לא חובה)</div>
    <textarea className="input" rows="2" value=${note} onInput=${e => setNote(e.target.value)} placeholder="למשל: הכפלתי את הכמויות, השתמשתי בחמאה במקום שמן"></textarea>

    <div className="sticky">
      <button className="btn primary block" disabled=${!files.length && !note.trim()} onClick=${go}>✨ ערוך מתכון</button>
    </div>
  </div>`;
}

  const [name, setName] = useState('');
  const [code, setCode] = useState('');
  const [joining, setJoining] = useState(false);
  const [people, setPeople] = useState([]);
  const [resetFor, setResetFor] = useState(null);
  const [tempPass, setTempPass] = useState('');
  const [newPass, setNewPass] = useState('');
  const [newPass2, setNewPass2] = useState('');
  const [showChange, setShowChange] = useState(false);
  const [busy, setBusy] = useState(false);
  const isOwner = kitchen.created_by === userId;

  const loadPeople = useCallback(async () => {
    const { data, error } = await sb.rpc('kitchen_people', { k: kitchen.id });
    if (!error) setPeople(data || []);
  }, [kitchen.id]);
  useEffect(() => { loadPeople(); }, [loadPeople]);

  const add = async () => {
    const n = name.trim();
    if (!n) return;
    if (GROUP_TAGS.includes(n) || members.some(m => m.name === n)) { toast('השם כבר קיים'); return; }
    const { error } = await sb.from('family_members').insert({ name: n, kitchen_id: kitchen.id });
    if (error) { toast('ההוספה נכשלה: ' + error.message); return; }
    setName('');
    reload();
  };
  const del = async m => {
    if (!confirm(`להסיר את ${m.name} מהרשימה? (המתכונים לא יימחקו)`)) return;
    const { error } = await sb.from('family_members').delete().eq('id', m.id);
    if (error) toast('ההסרה נכשלה: ' + error.message); else reload();
  };

  const invite = () => shareText(
    `הצטרפו לספר המתכונים "${kitchen.name}" 🍳\n${APP_URL}#join=${kitchen.invite_code}\n\nאו בתוך האפליקציה, עם קוד ההצטרפות: ${kitchen.invite_code}`,
    toast, 'ההזמנה הועתקה');

  const shareApp = () => shareText(
    `אפליקציה לשמירת מתכונים בהקלטה קולית או מצילום 🍳\n${APP_URL}`,
    toast, 'הקישור הועתק');

  const join = async () => {
    if (!code.trim()) return;
    setJoining(true);
    const { data, error } = await sb.rpc('join_kitchen', { code: code.trim().toUpperCase() });
    setJoining(false);
    if (error) { toast('ההצטרפות נכשלה: ' + error.message); return; }
    const k = one(data);
    setCode('');
    await reloadKitchens();
    if (k) onSwitch(k.id);
    toast(`הצטרפת ל"${k?.name || 'ספר המתכונים'}"`);
  };

  const doReset = async p => {
    if (tempPass.length < 6) { toast('הסיסמה צריכה להכיל לפחות 6 תווים'); return; }
    setBusy(true);
    try {
      await callServer({ action: 'reset-password', target_user_id: p.user_id, new_password: tempPass });
      shareText(`הסיסמה החדשה שלך לאפליקציית המתכונים: ${tempPass}\nאפשר להחליף אותה בלשונית משפחה, תחת "חשבון".\n${APP_URL}`,
        toast, 'הסיסמה אופסה והועתקה');
      setResetFor(null); setTempPass('');
    } catch (e) { toast('האיפוס נכשל: ' + e.message); }
    setBusy(false);
  };

  const changePassword = async () => {
    if (newPass.length < 6) { toast('הסיסמה צריכה להכיל לפחות 6 תווים'); return; }
    if (newPass !== newPass2) { toast('הסיסמאות לא זהות'); return; }
    setBusy(true);
    const { error } = await sb.auth.updateUser({ password: newPass });
    setBusy(false);
    if (error) { toast('השינוי נכשל: ' + authError(error)); return; }
    setNewPass(''); setNewPass2(''); setShowChange(false);
    toast('הסיסמה עודכנה ✓');
  };

  const logout = async () => {
    if (!confirm('להתנתק?')) return;
    store.del('kitchen-id');
    await sb.auth.signOut();
  };

  return html`<div className="wrap">
    <h1>${kitchen.name}</h1>

    <div className="card section">
      <h2 style=${{ marginTop: 0 }}>להזמין את המשפחה</h2>
      <p className="hint" style=${{ marginTop: 0 }}>מי שמצטרף רואה ועורך את כל המתכונים בספר הזה.</p>
      <div className="invite">${kitchen.invite_code}</div>
      <button className="btn primary block" onClick=${invite}>שלח הזמנה ↗</button>
    </div>

    ${people.length > 0 && html`<${React.Fragment}>
      <h2>החברים בספר</h2>
      <div className="card">
        ${people.map(p => html`<div key=${p.user_id} style=${{ borderBottom: '1px solid var(--border)' }}>
          <div className="member" style=${{ borderBottom: 0 }}>
            <span className="ltr" style=${{ overflow: 'hidden', textOverflow: 'ellipsis' }}>
              ${p.email}${p.is_owner ? ' 👑' : ''}${p.user_id === userId ? ' (אני)' : ''}
            </span>
            ${isOwner && p.user_id !== userId && html`<button className="btn sm"
              onClick=${() => { setResetFor(resetFor === p.user_id ? null : p.user_id); setTempPass(''); }}>איפוס סיסמה</button>`}
          </div>
          ${resetFor === p.user_id && html`<div className="row" style=${{ padding: '0 14px 12px' }}>
            <input className="input grow ltr" value=${tempPass} placeholder="סיסמה חדשה (6+ תווים)"
              onInput=${e => setTempPass(e.target.value)} />
            <button className="btn primary" disabled=${busy} onClick=${() => doReset(p)}>אפס</button>
          </div>`}
        </div>`)}
      </div>
      ${isOwner && html`<p className="hint">מי ששכח סיסמה: לחץ "איפוס סיסמה", בחר לו סיסמה חדשה ושלח לו אותה.</p>`}
    <//>`}

    <h2>תגיות "מי אהב"</h2>
    <p className="hint" style=${{ marginTop: 0 }}>השמות כאן יופיעו כתגיות בכל מתכון. "הורים" ו"ילדים" קיימים תמיד.</p>
    <div className="row" style=${{ marginTop: 8 }}>
      <input className="input grow" value=${name} placeholder="שם חדש" onInput=${e => setName(e.target.value)} onKeyDown=${e => e.key === 'Enter' && add()} />
      <button className="btn primary" onClick=${add}>הוסף</button>
    </div>
    ${members.length > 0 && html`<div className="card">
      ${members.map(m => html`<div className="member" key=${m.id}>
        <span>${m.name}</span>
        <button className="x" aria-label="הסר" onClick=${() => del(m)}>✕</button>
      </div>`)}
    </div>`}

    ${kitchens.length > 1 && html`<${React.Fragment}>
      <h2>ספרי המתכונים שלי</h2>
      <${Chips} options=${kitchens.map(k => k.name)} selected=${[kitchen.name]}
        onToggle=${n => { const k = kitchens.find(x => x.name === n); if (k) onSwitch(k.id); }} />
    <//>`}

    <h2>הצטרפות לספר נוסף</h2>
    <div className="row">
      <input className="input grow codeinput" style=${{ fontSize: 18, letterSpacing: 3 }} value=${code} placeholder="קוד הזמנה" maxLength="10"
        onInput=${e => setCode(e.target.value.toUpperCase())} onKeyDown=${e => e.key === 'Enter' && join()} />
      <button className="btn" disabled=${joining || !code.trim()} onClick=${join}>הצטרף</button>
    </div>

    <h2>לשתף את האפליקציה</h2>
    <p className="hint" style=${{ marginTop: 0 }}>קישור לאפליקציה בלי המתכונים שלך. מי שנכנס יוצר ספר מתכונים משלו.</p>
    <button className="btn block" onClick=${shareApp}>שתף את האפליקציה ↗</button>

    <h2>חשבון</h2>
    <div className="card">
      <div className="member">
        <span className="ltr" style=${{ overflow: 'hidden', textOverflow: 'ellipsis' }}>${email}</span>
        <button className="btn sm danger" onClick=${logout}>התנתק</button>
      </div>
      <div style=${{ padding: '12px 14px' }}>
        ${showChange
          ? html`<${React.Fragment}>
              <input className="input ltr" type="password" autoComplete="new-password" value=${newPass}
                placeholder="סיסמה חדשה (6+ תווים)" onInput=${e => setNewPass(e.target.value)} />
              <div style=${{ height: 8 }}></div>
              <input className="input ltr" type="password" autoComplete="new-password" value=${newPass2}
                placeholder="אימות סיסמה" onInput=${e => setNewPass2(e.target.value)} />
              <div className="row" style=${{ marginTop: 10, marginBottom: 0 }}>
                <button className="btn primary grow" disabled=${busy} onClick=${changePassword}>שמור סיסמה</button>
                <button className="btn" onClick=${() => { setShowChange(false); setNewPass(''); setNewPass2(''); }}>ביטול</button>
              </div>
            <//>`
          : html`<button className="btn block" onClick=${() => setShowChange(true)}>🔑 שינוי סיסמה</button>`}
      </div>
    </div>
  </div>`;
}

const TABS = [
  { id: 'list', ic: '📖', label: 'מתכונים' },
  { id: 'voice', ic: '🎤', label: 'הקלטה' },
  { id: 'upload', ic: '📷', label: 'העלאה' },
  { id: 'family', ic: '👨‍👩‍👧‍👦', label: 'משפחה' },
];

function MainApp({ kitchen, kitchens, onSwitch, reloadKitchens, email, userId, initialError }) {
  const [tab, setTab] = useState('list');
  const [view, setView] = useState(null);
  const [recipes, setRecipes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [members, setMembers] = useState([]);
  const [busy, setBusy] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const tRef = useRef(null);
  const draftKey = `draft-lines-${kitchen.id}`;

  const toast = useCallback(m => {
    setToastMsg(m);
    clearTimeout(tRef.current);
    tRef.current = setTimeout(() => setToastMsg(null), 4000);
  }, []);

  const loadMembers = useCallback(async () => {
    const { data, error } = await sb.from('family_members').select('*').eq('kitchen_id', kitchen.id).order('id');
    if (!error) setMembers(data);
  }, [kitchen.id]);

  const loadRecipes = useCallback(async () => {
    const { data, error } = await sb.from('recipes').select('*').eq('kitchen_id', kitchen.id).order('created_at', { ascending: false });
    if (error) toast('שגיאה בטעינת המתכונים: ' + error.message);
    else setRecipes(data.map(normalize));
    setLoading(false);
  }, [kitchen.id, toast]);

  useEffect(() => {
    loadRecipes();
    loadMembers();
    if (initialError) toast(initialError);
    const fromHash = () => {
      const m = location.hash.match(/r=([\w-]+)/);
      if (m) { setTab('list'); setView({ name: 'recipe', id: m[1] }); }
    };
    fromHash();
    window.addEventListener('hashchange', fromHash);
    return () => window.removeEventListener('hashchange', fromHash);
  }, []);

  useEffect(() => { window.scrollTo(0, 0); }, [view, tab]);

  const setHash = id => {
    try { history.replaceState(null, '', id ? `#r=${id}` : location.pathname + location.search); } catch {}
  };

  const openRecipe = id => { setHash(id); setView({ name: 'recipe', id }); };
  const closeView = () => { setHash(null); setView(null); };
  const goTab = t => { closeView(); setTab(t); };

  const onProcessed = (draft, source) => setView({ name: 'form', draft, source });

  const onSave = async (rec, file, oldUrl) => {
    const saved = await saveRecipe(rec, file, oldUrl, kitchen.id);
    if (view?.source === 'voice') store.del(draftKey);
    setRecipes(list => {
      const i = list.findIndex(x => x.id === saved.id);
      return i >= 0 ? list.map(x => x.id === saved.id ? saved : x) : [saved, ...list];
    });
    if (view?.source) setTab('list');
    openRecipe(saved.id);
    toast('המתכון נשמר ✓');
  };

  const onDelete = async r => {
    if (!confirm(`למחוק את "${r.title}"?`)) return;
    const { error } = await sb.from('recipes').delete().eq('id', r.id);
    if (error) { toast('המחיקה נכשלה: ' + error.message); return; }
    if (r.image_url) { try { await removeImage(r.image_url); } catch {} }
    setRecipes(list => list.filter(x => x.id !== r.id));
    closeView();
    toast('המתכון נמחק');
  };

  let overlay = null;
  if (view?.name === 'recipe') {
    const r = recipes.find(x => x.id === view.id);
    overlay = html`<${RecipeView} recipe=${r} loading=${loading} toast=${toast}
      onBack=${closeView}
      onEdit=${() => setView({ name: 'form', draft: r })}
      onDelete=${() => onDelete(r)} />`;
  } else if (view?.name === 'form') {
    overlay = html`<${RecipeForm} key=${view.draft.id || 'new'} initial=${view.draft} members=${members} toast=${toast}
      heading=${view.draft.id ? 'עריכת מתכון' : 'בדוק ושמור'}
      onSave=${onSave}
      onCancel=${() => view.draft.id ? openRecipe(view.draft.id) : closeView()} />`;
  }

  return html`<${React.Fragment}>
    <div hidden=${!!overlay}>
      ${tab === 'list' && html`<${ListView} recipes=${recipes} loading=${loading} members=${members} onOpen=${openRecipe} kitchenName=${kitchen.name} />`}
      ${tab === 'voice' && html`<${VoiceView} onProcessed=${onProcessed} setBusy=${setBusy} toast=${toast} draftKey=${draftKey} />`}
      ${tab === 'upload' && html`<${UploadView} onProcessed=${onProcessed} setBusy=${setBusy} toast=${toast} />`}
      ${tab === 'family' && html`<${FamilyView} members=${members} reload=${loadMembers} toast=${toast}
        kitchen=${kitchen} kitchens=${kitchens} onSwitch=${onSwitch} reloadKitchens=${reloadKitchens} email=${email} userId=${userId} />`}
    </div>
    ${overlay}

    <nav className="tabbar">
      ${TABS.map(t => html`<button key=${t.id} className=${tab === t.id && !overlay ? 'on' : ''} onClick=${() => goTab(t.id)}>
        <span className="ic">${t.ic}</span>${t.label}
      </button>`)}
    </nav>

    ${busy && html`<div className="overlay"><div className="spin"></div><div>${busy}</div></div>`}
    ${toastMsg && html`<div className="toast" onClick=${() => setToastMsg(null)}>${toastMsg}</div>`}
  <//>`;
}

function KitchenGate({ session }) {
  const [loading, setLoading] = useState(true);
  const [kitchens, setKitchens] = useState([]);
  const [currentId, setCurrentId] = useState(() => store.get('kitchen-id', null));
  const [err, setErr] = useState('');

  const choose = useCallback(id => { store.set('kitchen-id', id); setCurrentId(id); }, []);

  const load = useCallback(async () => {
    const pending = store.get('pending-join', null);
    if (pending) {
      store.del('pending-join');
      const { data, error } = await sb.rpc('join_kitchen', { code: pending });
      if (error) setErr('ההצטרפות עם הקישור נכשלה: ' + error.message);
      else { const k = one(data); if (k) choose(k.id); }
    }
    const { data, error } = await sb.from('kitchen_members')
      .select('kitchen_id, kitchens(id, name, invite_code, created_by)')
      .eq('user_id', session.user.id);
    if (error) setErr('שגיאה בטעינה: ' + error.message);
    else setKitchens((data || []).map(r => r.kitchens).filter(Boolean));
    setLoading(false);
  }, [session.user.id, choose]);

  useEffect(() => { load(); }, [load]);

  if (loading) return html`<div className="boot">טוען…</div>`;
  if (!kitchens.length) return html`<${SetupView} email=${session.user.email} initialErr=${err}
    onDone=${k => { if (k) choose(k.id); setErr(''); load(); }} />`;
  const kitchen = kitchens.find(k => k.id === currentId) || kitchens[0];
  return html`<${MainApp} key=${kitchen.id} kitchen=${kitchen} kitchens=${kitchens}
    onSwitch=${choose} reloadKitchens=${load} email=${session.user.email} userId=${session.user.id} initialError=${err} />`;
}

function Root() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: { subscription } } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);
  if (session === undefined) return html`<div className="boot">טוען…</div>`;
  if (!session) return html`<${LoginView} />`;
  return html`<${KitchenGate} key=${session.user.id} session=${session} />`;
}

createRoot(document.getElementById('root')).render(html`<${Root} />`);
</script>
</body>
</html>
